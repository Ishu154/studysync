# Render.com deployment configuration
# This deploys the whiteboard app as a single web service
# serving both the frontend (static) and backend (Socket.io)

services:
  - type: web
    name: studysync
    runtime: node
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false # Set securely in Render dashboard
